services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: divulgazap-laravel
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      - db
    networks:
      - laravel-network

  nginx:
    image: nginx:alpine
    container_name: divulgazap-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/laravel.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel-network

  db:
    image: mysql:8.4
    container_name: divulgazap-db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: divulgazap-pma
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db
    networks:
      - laravel-network

  scheduler:
    build: .
    container_name: divulgazap-scheduler
    restart: always
    command: php artisan schedule:work
    depends_on:
      - app
    networks:
      - laravel-network    

networks:
  laravel-network:
    driver: bridge

volumes:
  db_data: