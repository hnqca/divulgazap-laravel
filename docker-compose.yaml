services:
  app:
    build: .
    container_name: divulgazap-laravel
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql-divulgazap-laravel
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: divulgazap
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin-divulgazap-laravel
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

  scheduler:
    build: .
    restart: always
    volumes:
      - .:/var/www
    working_dir: /var/www
    command: php artisan schedule:work

volumes:
  db_data: